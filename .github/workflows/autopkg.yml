---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: AutoPkg

on:
  push:
    branches:
      - main
    paths:
      - RecipeOverrides/**
      - repositories.json
      - secrets.sops.env
  workflow_dispatch:
    inputs:
      recipe:
        description: Optional recipe name, for example GoogleChrome
        type: string
        default: ""
        required: false

concurrency:
  group: autopkg
  cancel-in-progress: false

permissions:
  contents: read

env:
  MISE_NO_HOOKS: "1"
  MISE_TASK_RUN_AUTO_INSTALL: "false"

jobs:
  plan:
    name: Plan Recipe Run
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.plan.outputs.changed }}
      recipes: ${{ steps.plan.outputs.recipes }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          install_args: --locked python

      - name: Install Python dependencies
        run: mise deps install --force pip

      - name: Select recipes
        id: plan
        env:
          REQUESTED_RECIPE: ${{ inputs.recipe }}
        run: |
          mkdir -p .autopkg-run
          if [[ -n "$REQUESTED_RECIPE" ]]; then
            python scripts/recipes.py select "$REQUESTED_RECIPE"
          else
            python scripts/recipes.py select
          fi
          python scripts/recipes.py selected > .autopkg-run/planned-recipes.txt

          {
            if [[ -s .autopkg-run/planned-recipes.txt ]]; then
              echo "changed=true"
            else
              echo "changed=false"
            fi
            echo "recipes<<AUTOPKG_RECIPES"
            cat .autopkg-run/planned-recipes.txt
            echo "AUTOPKG_RECIPES"
          } >> "$GITHUB_OUTPUT"

  run:
    name: Run AutoPkg
    needs: plan
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.plan.outputs.changed == 'true'
    runs-on:
      group: autopkg
    timeout-minutes: 180
    env:
      AUTOPKG_STATE_DIR: ${{ github.workspace }}/.autopkg-run
      AUTOPKG_FAIL_RECIPES_WITHOUT_TRUST_INFO: "1"
      PLANNED_RECIPES: ${{ needs.plan.outputs.recipes }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Munki
        uses: ./.github/actions/setup-munki
        with:
          version: "7.3.0" # renovate: datasource=github-releases depName=munki/munki

      - name: Setup AutoPkg
        uses: ./.github/actions/setup-autopkg
        with:
          version: "3.0.0RC4" # renovate: datasource=github-releases depName=autopkg/autopkg

      - name: Setup Mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          install_args: --locked python sops age

      - name: Install Python dependencies
        run: mise deps install --force pip

      - name: Check runner
        run: mise run preflight

      - name: Select recipes
        run: |
          recipes=()
          while IFS= read -r recipe; do
            [[ -n "$recipe" ]] && recipes+=("$recipe")
          done <<< "$PLANNED_RECIPES"
          [[ "${#recipes[@]}" -gt 0 ]]
          mise run recipes:select -- "${recipes[@]}"

      - name: Sync pinned repositories
        run: mise run repos:sync

      - name: Install icon processor dependency
        run: mise run autopkg:deps

      - name: Write AutoPkg preferences
        run: mise run autopkg:preferences

      - name: Generate recipe map
        run: autopkg generate-recipe-map --prefs="$AUTOPKG_STATE_DIR/preferences.plist"

      - name: Run AutoPkg
        id: autopkg
        run: mise run secrets:run

      - name: Upload run summary
        if: >-
          always() &&
          (steps.autopkg.outcome == 'success' ||
          steps.autopkg.outcome == 'failure')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: autopkg-summary-${{ github.run_id }}
          path: artifacts/autopkg-summary.*
          if-no-files-found: error
          retention-days: 14
