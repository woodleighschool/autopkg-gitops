[tools]
python = "3.14.7"
gh = "2.98.0"
lefthook = "2.1.12"
actionlint = "1.7.12"
zizmor = "1.29.0"
oxfmt = "0.65.0"
shellcheck = "0.11.0"
sops = "3.13.3"
age = "1.3.1"

[settings]
experimental = true
pin = true
lockfile = true

[env]
_.python.venv = { path = ".venv", create = true }
AUTOPKG_STATE_DIR = "{{ get_env(name='AUTOPKG_STATE_DIR', default=config_root ~ '/.autopkg-run') }}"
AUTOPKG_REPO_ROOT = "{{ get_env(name='AUTOPKG_REPO_ROOT', default=env.HOME ~ '/Library/AutoPkg/RecipeRepos') }}"
AUTOPKG_FAIL_RECIPES_WITHOUT_TRUST_INFO = "1"
SOPS_AGE_KEY_FILE = "{{ get_env(name='SOPS_AGE_KEY_FILE', default=config_root ~ '/age.key') }}"

[deps.pip]
auto = true

[tasks.format]
description = "Format YAML, JSON, and Markdown"
run = "oxfmt . '!RecipeOverrides/**' '!.mise/**'"

[tasks.fmt-check]
description = "Check YAML, JSON, and Markdown formatting"
run = "oxfmt --check . '!RecipeOverrides/**' '!.mise/**'"

[tasks.validate]
description = "Validate recipe overrides and repository pins"
run = "python scripts/recipes.py validate"

[tasks.workflow-lint]
description = "Lint GitHub Actions workflows"
run = ["actionlint", "zizmor --offline --no-ignores .github/workflows"]

[tasks.shell-lint]
description = "Lint action installers"
run = "shellcheck .github/actions/*/install.sh"

[tasks.lint]
description = "Run static checks"
depends = ["fmt-check", "validate", "workflow-lint", "shell-lint"]

[tasks.test]
description = "Run unit tests"
run = "PYTHONPATH=scripts python -m unittest discover -s tests -v"

[tasks.check]
description = "Run static checks and tests"
depends = ["lint", "test"]

[tasks."recipes:select"]
description = "Select recipes"
run = "python scripts/recipes.py select"

[tasks."repos:sync"]
description = "Sync pinned revisions"
run = "python scripts/repositories.py"

[tasks."autopkg:preferences"]
description = "Write preferences"
run = "python scripts/preferences.py"

[tasks."autopkg:deps"]
description = "Install AutoPkg runtime dependencies"
run = '''
/usr/local/autopkg/python -m pip install --user cryptography
pyobjc_version="$(/usr/local/autopkg/python -c 'from importlib.metadata import version; print(version("pyobjc-core"))')"
/usr/local/autopkg/python -m pip install --user --no-deps "pyobjc-framework-QuickLookThumbnailing==$pyobjc_version"
'''

[tasks."secrets:edit"]
description = "Edit encrypted inputs"
run = "sops edit secrets.sops.env"

[tasks."secrets:run"]
hide = true
run = '''
secret_keys="$(sed -nE 's/^(AUTOPKG_[A-Za-z_][A-Za-z0-9_]*)=.*/\1/p' secrets.sops.env | paste -sd, -)"
SOPS_AUTOPKG_KEYS="$secret_keys" sops exec-env secrets.sops.env 'python scripts/run.py'
'''

[tasks."trust:create"]
description = "Create an override"
usage = '''
arg "<recipe>" help="Source recipe identifier"
'''
run = '''
mise run trust:prepare
recipe_name="${usage_recipe##*.}"
recipe_namespace="${usage_recipe%.*}"
recipe_type="${recipe_namespace##*.}"
override_name="$recipe_name.$recipe_type"
override_path="$PWD/RecipeOverrides/$override_name.recipe.yaml"
autopkg make-override \
  --prefs="$AUTOPKG_STATE_DIR/preferences.plist" \
  --format=yaml \
  --name="$override_name" \
  --override-dir="$PWD/RecipeOverrides" \
  "${usage_recipe?}"
python scripts/clear_override_input.py "$override_path"
'''

[tasks."trust:update"]
description = "Refresh trust info"
usage = '''
arg "<recipe>" help="Override identifier"
'''
run = '''
mise run trust:prepare
autopkg update-trust-info \
  --prefs="$AUTOPKG_STATE_DIR/preferences.plist" \
  --override-dir="$PWD/RecipeOverrides" \
  "${usage_recipe?}"
'''

[tasks."trust:update-all"]
description = "Refresh all trust info"
run = '''
mise run trust:prepare
python scripts/recipes.py list > "$AUTOPKG_STATE_DIR/overrides.txt"
overrides=()
while IFS= read -r override; do
  [[ -n "$override" ]] && overrides+=("$override")
done < "$AUTOPKG_STATE_DIR/overrides.txt"
autopkg update-trust-info \
  --prefs="$AUTOPKG_STATE_DIR/preferences.plist" \
  --override-dir="$PWD/RecipeOverrides" \
  "${overrides[@]}"
'''

[tasks."trust:verify"]
description = "Show trust differences"
run = '''
mise run trust:prepare
python scripts/recipes.py list > "$AUTOPKG_STATE_DIR/overrides.txt"
autopkg verify-trust-info -vv \
  --prefs="$AUTOPKG_STATE_DIR/preferences.plist" \
  --override-dir="$PWD/RecipeOverrides" \
  --recipe-list="$AUTOPKG_STATE_DIR/overrides.txt"
'''

[tasks."trust:prepare"]
hide = true
run = '''
python scripts/repositories.py
python scripts/preferences.py
autopkg generate-recipe-map --prefs="$AUTOPKG_STATE_DIR/preferences.plist"
'''

[tasks.local]
description = "Run locally"
usage = '''
arg "[recipe]" help="Recipe name; defaults to all overrides"
'''
run = '''
if [[ -n "${usage_recipe:-}" ]]; then
  mise run recipes:select -- "$usage_recipe"
else
  mise run recipes:select
fi
mise run repos:sync
mise run autopkg:deps
mise run autopkg:preferences
autopkg generate-recipe-map --prefs="$AUTOPKG_STATE_DIR/preferences.plist"
mise run secrets:run
'''

[tasks.remote]
description = "Run on main"
usage = '''
arg "[recipe]" help="Recipe name; defaults to all overrides"
'''
run = '''
if [[ -n "${usage_recipe:-}" ]]; then
  gh workflow run autopkg.yml --ref main --field "recipe=$usage_recipe"
else
  gh workflow run autopkg.yml --ref main
fi
'''

[hooks]
postinstall = "lefthook install"
