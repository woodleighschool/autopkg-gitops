---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: AutoPkg

on:
  workflow_dispatch:
    inputs:
      recipe:
        description: Optional enabled recipe name, for example GoogleChrome
        type: string
        default: ""
        required: false

concurrency:
  group: autopkg
  cancel-in-progress: false

permissions:
  contents: read

env:
  MISE_NO_HOOKS: "1"
  MISE_TASK_RUN_AUTO_INSTALL: "false"

jobs:
  run:
    name: Run AutoPkg
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on:
      group: autopkg
    timeout-minutes: 180
    env:
      AUTOPKG_STATE_DIR: ${{ runner.temp }}/autopkg
      AUTOPKG_WOODSTAR_URL: ${{ vars.WOODSTAR_URL }}
      AUTOPKG_WOODSTAR_API_KEY: ${{ secrets.WOODSTAR_TOKEN }}
      AUTOPKG_ACTIVINSPIRE_SERIAL: ${{ secrets.ACTIVINSPIRE_SERIAL }}
      AUTOPKG_FAIL_RECIPES_WITHOUT_TRUST_INFO: "1"
      REQUESTED_RECIPE: ${{ inputs.recipe }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          experimental: true
          install_args: --locked python uv

      - name: Check runner
        run: mise run preflight

      - name: Select recipes
        run: |
          if [[ -n "$REQUESTED_RECIPE" ]]; then
            mise run recipes:select -- "$REQUESTED_RECIPE"
          else
            mise run recipes:select
          fi

      - name: Sync required repositories
        run: mise run repos:sync

      - name: Install recipe dependency
        run: mise run autopkg:deps

      - name: Write AutoPkg preferences
        run: mise run autopkg:preferences

      - name: Generate recipe map
        run: autopkg generate-recipe-map --prefs="$AUTOPKG_STATE_DIR/preferences.plist"

      - name: Verify parent trust
        run: autopkg verify-trust-info --prefs="$AUTOPKG_STATE_DIR/preferences.plist" --recipe-list="$AUTOPKG_STATE_DIR/recipes.plist"

      - name: Run AutoPkg
        id: autopkg
        run: |
          autopkg_exit_code=0
          autopkg run \
            --quiet \
            --prefs="$AUTOPKG_STATE_DIR/preferences.plist" \
            --report-plist "$AUTOPKG_STATE_DIR/autopkg-results.plist" \
            --recipe-list="$AUTOPKG_STATE_DIR/recipes.plist" || autopkg_exit_code=$?
          echo "exit_code=$autopkg_exit_code" >> "$GITHUB_OUTPUT"
          exit "$autopkg_exit_code"

      - name: Render run summary
        if: ${{ always() }}
        env:
          AUTOPKG_EXIT_CODE: ${{ steps.autopkg.outputs.exit_code || '1' }}
        run: mise run report

      - name: Upload run summary
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: autopkg-summary-${{ github.run_id }}
          path: artifacts/autopkg-summary.*
          if-no-files-found: error
          retention-days: 14
