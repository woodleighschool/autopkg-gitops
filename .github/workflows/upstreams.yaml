---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Upstreams

on:
  workflow_call:
    secrets:
      BOT_APP_PRIVATE_KEY:
        required: true
      BOT_CLIENT_ID:
        required: true

permissions:
  contents: read

env:
  MISE_NO_HOOKS: "1"
  MISE_TASK_RUN_AUTO_INSTALL: "false"

jobs:
  trust:
    name: Review Trust
    if: >-
      github.event_name == 'merge_group' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}

      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: pull
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}

      - name: Check repository changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          if git -C pull diff --quiet "$BASE_SHA" "$HEAD_SHA" -- repositories.json; then
            echo "repositories=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "repositories=true" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT_NAME" == "pull_request" && "$HEAD_REF" == renovate/* ]]; then
            while IFS= read -r changed_path; do
              case "$changed_path" in
                repositories.json|RecipeOverrides/*.recipe.yaml) ;;
                *)
                  echo "Renovate may not change $changed_path" >&2
                  exit 1
                  ;;
              esac
            done < <(git -C pull diff --name-only "$BASE_SHA" "$HEAD_SHA")
            echo "renovate=true" >> "$GITHUB_OUTPUT"
            echo "script_root=$GITHUB_WORKSPACE" >> "$GITHUB_OUTPUT"
          else
            echo "renovate=false" >> "$GITHUB_OUTPUT"
            echo "script_root=$GITHUB_WORKSPACE/pull" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup AutoPkg
        if: ${{ steps.changes.outputs.repositories == 'true' }}
        uses: ./.github/actions/setup-autopkg
        with:
          version: "3.0.0RC4" # renovate: datasource=github-releases depName=autopkg/autopkg

      - name: Setup Mise
        if: ${{ steps.changes.outputs.repositories == 'true' }}
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          install_args: --locked python

      - name: Install Python dependencies
        if: ${{ steps.changes.outputs.repositories == 'true' }}
        run: mise deps install --force pip

      - name: Sync repositories
        if: ${{ steps.changes.outputs.repositories == 'true' }}
        env:
          AUTOPKG_STATE_DIR: ${{ github.workspace }}/.autopkg-run
          SCRIPT_ROOT: ${{ steps.changes.outputs.script_root }}
        run: |
          python "$SCRIPT_ROOT/scripts/repositories.py" \
            --manifest "$GITHUB_WORKSPACE/pull/repositories.json"
          python "$SCRIPT_ROOT/scripts/preferences.py" \
            --manifest "$GITHUB_WORKSPACE/pull/repositories.json" \
            --override-dir "$GITHUB_WORKSPACE/pull/RecipeOverrides" \
            --recipes-dir "$GITHUB_WORKSPACE/pull/Recipes"
          autopkg generate-recipe-map --prefs="$AUTOPKG_STATE_DIR/preferences.plist"

      - name: Check trust changes
        if: >-
          steps.changes.outputs.repositories == 'true' &&
          github.event_name == 'pull_request'
        env:
          AUTOPKG_STATE_DIR: ${{ github.workspace }}/.autopkg-run
          SCRIPT_ROOT: ${{ steps.changes.outputs.script_root }}
        run: |
          python "$SCRIPT_ROOT/scripts/recipes.py" list \
            --override-dir "$GITHUB_WORKSPACE/RecipeOverrides" \
            > "$AUTOPKG_STATE_DIR/base-overrides.txt"
          set +e
          autopkg verify-trust-info -vv \
            --prefs="$AUTOPKG_STATE_DIR/preferences.plist" \
            --override-dir="$GITHUB_WORKSPACE/RecipeOverrides" \
            --recipe-list="$AUTOPKG_STATE_DIR/base-overrides.txt" \
            2>&1 | tee "$AUTOPKG_STATE_DIR/trust-before.txt"
          set -e

      - name: Refresh trust
        if: >-
          steps.changes.outputs.repositories == 'true' &&
          steps.changes.outputs.renovate == 'true'
        env:
          AUTOPKG_STATE_DIR: ${{ github.workspace }}/.autopkg-run
          SCRIPT_ROOT: ${{ steps.changes.outputs.script_root }}
        run: |
          python "$SCRIPT_ROOT/scripts/trust_report.py" failures \
            "$AUTOPKG_STATE_DIR/trust-before.txt" \
            > "$AUTOPKG_STATE_DIR/failed-overrides.txt"
          failures=()
          while IFS= read -r recipe; do
            [[ -n "$recipe" ]] && failures+=("$recipe")
          done < "$AUTOPKG_STATE_DIR/failed-overrides.txt"

          if [[ "${#failures[@]}" -gt 0 ]]; then
            autopkg update-trust-info \
              --prefs="$AUTOPKG_STATE_DIR/preferences.plist" \
              --override-dir="$GITHUB_WORKSPACE/pull/RecipeOverrides" \
              "${failures[@]}"
          fi

      - name: Verify trust
        if: ${{ steps.changes.outputs.repositories == 'true' }}
        env:
          AUTOPKG_STATE_DIR: ${{ github.workspace }}/.autopkg-run
          SCRIPT_ROOT: ${{ steps.changes.outputs.script_root }}
        run: |
          python "$SCRIPT_ROOT/scripts/recipes.py" list \
            --override-dir "$GITHUB_WORKSPACE/pull/RecipeOverrides" \
            > "$AUTOPKG_STATE_DIR/head-overrides.txt"
          autopkg verify-trust-info -vv \
            --prefs="$AUTOPKG_STATE_DIR/preferences.plist" \
            --override-dir="$GITHUB_WORKSPACE/pull/RecipeOverrides" \
            --recipe-list="$AUTOPKG_STATE_DIR/head-overrides.txt"

      - name: Write trust review
        if: >-
          steps.changes.outputs.repositories == 'true' &&
          github.event_name == 'pull_request'
        env:
          AUTOPKG_STATE_DIR: ${{ github.workspace }}/.autopkg-run
          SCRIPT_ROOT: ${{ steps.changes.outputs.script_root }}
        run: |
          python "$SCRIPT_ROOT/scripts/trust_report.py" render \
            --base-manifest repositories.json \
            --head-manifest pull/repositories.json \
            --verification "$AUTOPKG_STATE_DIR/trust-before.txt" \
            --output pull/artifacts/trust-review.md

      - name: Check trust update
        id: trust
        if: ${{ steps.changes.outputs.repositories == 'true' }}
        run: |
          if git -C pull diff --quiet -- RecipeOverrides; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          while IFS= read -r changed_path; do
            [[ "$changed_path" == RecipeOverrides/*.recipe.yaml ]]
          done < <(git -C pull diff --name-only -- RecipeOverrides)
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Generate Token
        if: >-
          github.event_name == 'pull_request' &&
          steps.changes.outputs.repositories == 'true' &&
          steps.changes.outputs.renovate == 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Commit trust update
        if: >-
          steps.changes.outputs.renovate == 'true' &&
          steps.trust.outputs.changed == 'true'
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_TOKEN: ${{ steps.app-token.outputs.token }}
        working-directory: pull
        run: |
          expected_author="woodmin[bot] <225126206+woodmin[bot]@users.noreply.github.com>"
          actual_author="$(git show -s --format='%an <%ae>' HEAD)"
          [[ "$actual_author" == "$expected_author" ]]

          git config user.name "woodmin[bot]"
          git config user.email "225126206+woodmin[bot]@users.noreply.github.com"
          git add -- RecipeOverrides
          git commit --amend --no-edit
          git push \
            --force-with-lease="refs/heads/${HEAD_REF}:${HEAD_SHA}" \
            "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/${HEAD_REF}"

      - name: Post trust review
        if: >-
          steps.changes.outputs.renovate == 'true' &&
          steps.trust.outputs.changed == 'false'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          header: autopkg/trust
          path: pull/artifacts/trust-review.md
          skip_unchanged: true
