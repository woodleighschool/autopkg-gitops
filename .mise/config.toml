[tools]
python = "3.14.7"
gh = "2.98.0"
lefthook = "2.1.11"
actionlint = "1.7.12"
zizmor = "1.29.0"
oxfmt = "0.64.0"
shellcheck = "0.11.0"
sops = "3.13.3"
age = "1.3.1"

[settings]
experimental = true
pin = true
lockfile = true

[env]
_.python.venv = { path = ".venv", create = true }
AUTOPKG_STATE_DIR = "{{ get_env(name='AUTOPKG_STATE_DIR', default=config_root ~ '/.autopkg-run') }}"
AUTOPKG_REPO_ROOT = "{{ get_env(name='AUTOPKG_REPO_ROOT', default=env.HOME ~ '/Library/AutoPkg/RecipeRepos') }}"
AUTOPKG_FAIL_RECIPES_WITHOUT_TRUST_INFO = "1"
SOPS_AGE_KEY_FILE = "{{ get_env(name='SOPS_AGE_KEY_FILE', default=config_root ~ '/age.key') }}"

[deps.pip]
auto = true

[tasks."overrides:mark"]
hide = true
run = "python scripts/mark_overrides.py"

[tasks.format]
description = "Format configuration and mark generated overrides"
depends = ["overrides:mark"]
run = "oxfmt . '!RecipeOverrides/**' '!.mise/**'"

[tasks.fmt-check]
description = "Check formatting and generated override headers"
run = [
  "python scripts/mark_overrides.py --check",
  "oxfmt --check . '!RecipeOverrides/**' '!.mise/**'",
]

[tasks.validate]
description = "Validate recipe overrides and repository ownership"
run = "python scripts/recipes.py validate"

[tasks."sources:check"]
description = "Check declared GitOps recipes have generated overrides"
run = "python scripts/sources.py check"

[tasks.workflow-lint]
description = "Lint GitHub Actions workflows"
run = ["actionlint", "zizmor --offline --no-ignores .github/workflows"]

[tasks.shell-lint]
description = "Lint composite action installers"
run = "shellcheck .github/actions/*/install.sh"

[tasks.lint]
description = "Run repository checks"
depends = ["fmt-check", "validate", "workflow-lint", "shell-lint"]

[tasks.test]
description = "Run unit tests"
run = "PYTHONPATH=scripts python -m unittest discover -s tests -v"

[tasks.check]
description = "Run repository checks and tests"
depends = ["lint", "test"]

[tasks.preflight]
description = "Check the current runner has AutoPkg v3 and Munki"
run = '''
version="$(autopkg version)"
if [[ "$version" != 3.* ]]; then
  echo "AutoPkg v3 is required; found $version" >&2
  exit 1
fi
test -x /usr/local/munki/makepkginfo
'''

[tasks."recipes:select"]
description = "Resolve recipes and their repository closure"
run = "python scripts/recipes.py select"

[tasks."repos:sync"]
description = "Materialize only repositories used by the selected recipes"
run = "python scripts/repositories.py"

[tasks."runtime:prepare"]
description = "Prepare selected overrides with their pinned recipe resources"
run = "python scripts/runtime.py"

[tasks."autopkg:preferences"]
description = "Write ephemeral AutoPkg preferences for the selected repositories"
run = "python scripts/preferences.py"

[tasks."autopkg:deps"]
description = "Install the Python framework used by the local icon processor"
run = '''
pyobjc_version="$(/usr/local/autopkg/python -c 'from importlib.metadata import version; print(version("pyobjc-core"))')"
/usr/local/autopkg/python -m pip install --user --no-deps "pyobjc-framework-QuickLookThumbnailing==$pyobjc_version"
'''

[tasks."secrets:edit"]
description = "Edit encrypted AutoPkg runtime inputs"
run = "sops edit secrets.sops.env"

[tasks."secrets:run"]
hide = true
run = '''
secret_keys="$(sed -nE 's/^(AUTOPKG_[A-Za-z_][A-Za-z0-9_]*)=.*/\1/p' secrets.sops.env | paste -sd, -)"
if [[ -z "$secret_keys" ]]; then
  echo "secrets.sops.env contains no AUTOPKG_* inputs" >&2
  exit 1
fi
SOPS_AUTOPKG_KEYS="$secret_keys" sops exec-env secrets.sops.env 'python scripts/run.py'
'''

[tasks."trust:create"]
description = "Create a generated override from a Munki recipe"
usage = '''
arg "<recipe>" help="Source recipe identifier"
'''
run = '''
mkdir -p "$AUTOPKG_STATE_DIR"
python scripts/repositories.py --all
python scripts/preferences.py \
  --all-repositories \
  --override-dir "$PWD/RecipeOverrides"
autopkg generate-recipe-map --prefs="$AUTOPKG_STATE_DIR/preferences.plist"
autopkg make-override \
  --prefs="$AUTOPKG_STATE_DIR/preferences.plist" \
  --format=yaml \
  --override-dir="$PWD/RecipeOverrides" \
  "${usage_recipe?}"
mise run overrides:mark
'''

[tasks."trust:update"]
description = "Regenerate one override from its pinned recipe chain"
usage = '''
arg "<recipe>" help="Generated override identifier"
'''
run = '''
mise run trust:prepare
source_recipe="$(python scripts/recipes.py parents "${usage_recipe?}")"
autopkg make-override \
  --prefs="$AUTOPKG_STATE_DIR/preferences.plist" \
  --force \
  --format=yaml \
  --override-dir="$PWD/RecipeOverrides" \
  "$source_recipe"
mise run overrides:mark
'''

[tasks."trust:update-all"]
description = "Regenerate every override from its pinned recipe chain"
run = '''
mise run trust:prepare
python scripts/recipes.py parents > "$AUTOPKG_STATE_DIR/parent-recipes.txt"
while IFS= read -r source_recipe; do
  autopkg make-override \
    --prefs="$AUTOPKG_STATE_DIR/preferences.plist" \
    --force \
    --format=yaml \
    --override-dir="$PWD/RecipeOverrides" \
    "$source_recipe"
done < "$AUTOPKG_STATE_DIR/parent-recipes.txt"
mise run overrides:mark
'''

[tasks."trust:prepare"]
hide = true
run = '''
python scripts/repositories.py --all
python scripts/preferences.py \
  --all-repositories \
  --override-dir "$PWD/RecipeOverrides"
autopkg generate-recipe-map --prefs="$AUTOPKG_STATE_DIR/preferences.plist"
'''

[tasks.local]
description = "Run the Actions lane locally"
usage = '''
arg "[recipe]" help="Optional recipe name; defaults to every override"
'''
run = '''
mise run preflight
if [[ -n "${usage_recipe:-}" ]]; then
  mise run recipes:select -- "$usage_recipe"
else
  mise run recipes:select
fi
mise run repos:sync
mise run autopkg:deps
mise run runtime:prepare
mise run autopkg:preferences
autopkg generate-recipe-map --prefs="$AUTOPKG_STATE_DIR/preferences.plist"
mise run secrets:run
'''

[tasks.remote]
description = "Trigger the Actions lane on main"
usage = '''
arg "[recipe]" help="Optional recipe name; defaults to every override"
'''
run = '''
if [[ -n "${usage_recipe:-}" ]]; then
  gh workflow run autopkg.yml --ref main --field "recipe=$usage_recipe"
else
  gh workflow run autopkg.yml --ref main
fi
'''

[hooks]
postinstall = "lefthook install"
