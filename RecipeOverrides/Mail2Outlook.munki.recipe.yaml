    postinstall_script: |-
      #!/bin/zsh --no-rcs

      set -euo pipefail

      outlook="/Applications/Microsoft Outlook.app"

      if [[ ! -d "${outlook}" ]]; then
          echo "Microsoft Outlook is not installed." >&2
          exit 1
      fi

      logged_in_user="$(/usr/bin/stat -f '%Su' /dev/console)"
      if [[ -z "${logged_in_user}" || "${logged_in_user}" == "root" || "${logged_in_user}" == "loginwindow" ]]; then
          echo "Mail2Outlook requires a logged-in user." >&2
          exit 1
      fi

      user_id="$(/usr/bin/id -u "${logged_in_user}")"

      run_as_user() {
          /bin/launchctl asuser "${user_id}" /usr/bin/sudo -u "${logged_in_user}" "$@"
      }

      set_handler_result="$(run_as_user /usr/bin/osascript -l JavaScript \
          -e 'ObjC.import("CoreServices"); $.LSSetDefaultHandlerForURLScheme($("mailto"), $("com.microsoft.Outlook"))')"

      if [[ "${set_handler_result}" != "0" ]]; then
          echo "Unable to set Microsoft Outlook as the default mail client: ${set_handler_result}" >&2
          exit 1
      fi

      handler="$(run_as_user /usr/bin/osascript -l JavaScript \
          -e 'ObjC.import("CoreServices"); ObjC.unwrap(ObjC.castRefToObject($.LSCopyDefaultHandlerForURLScheme($("mailto"))))')"

      if [[ "${handler}" != "com.microsoft.Outlook" ]]; then
          echo "Microsoft Outlook is not the default mail client." >&2
          exit 1
      fi

      echo "Microsoft Outlook set as the default mail client."
